<title>Links Rápidos – Setor Elétrico</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
    --card-radius: 18px;
    --btn-bg: #1e9e8e;
    --btn-hover: #178070;
    --btn-text: #ffffff;
    --btn-radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .wrapper {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 960px;
    width: 100%;
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    padding: 28px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    flex: 1 1 380px;
    min-width: 320px;
    max-width: 440px;
    transition: box-shadow .2s;
  }
  .card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.13); }
  .logo-area {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 72px;
  }
  .logo-area img {
    max-height: 72px;
    max-width: 200px;
    object-fit: contain;
  }
  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }
  .btn {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: var(--btn-radius);
    padding: 11px 10px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .18s, transform .12s;
    line-height: 1.3;
  }
  .btn:hover {
    background: var(--btn-hover);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
</style>
</head>
